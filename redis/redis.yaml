apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deploy
  namespace: voting-app
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          image: redis:7
          ports:
            - containerPort: 6379
          readinessProbe:
              exec:
                command:
                  - redis-cli
                  - ping
          livenessProbe:
              exec:
                command:
                  - redis-cli
                  - ping

---

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: voting-app
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
