apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-deploy
  namespace: voting-app
  labels:
    app: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          image: voting-app-result-v1:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          startupProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---

apiVersion: v1
kind: Service
metadata:
  name: result
  namespace: voting-app
spec:
  type: ClusterIP
  selector:
    app: result
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
