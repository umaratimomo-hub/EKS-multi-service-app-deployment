name: App CI

on:
  push:
    branches: [ main ]
    paths:
      - 'voting-app/**'
      - 'voting-app/result/Dockerfile'
      - 'voting-app/seed-data/Dockerfile'
      - 'voting-app/vote/Dockerfile'
      - 'voting-app/worker/Dockerfile'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint-dockerfiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: vote
            path: voting-app/vote/Dockerfile
            context: voting-app/vote
          - name: worker
            path: voting-app/worker/Dockerfile
            context: voting-app/worker
          - name: result
            path: voting-app/result/Dockerfile
            context: voting-app/result
          # - name: seed-data
          #   path: voting-app/seed-data/Dockerfile
          #   context: voting-app/seed-data

    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service.path }}
          failure-threshold: error

      - name: Run Application Tests
        run: |
          echo "Running application unit tests..."

      - name: Build Docker Image
        id: build-image
            # env:
            #   EVENT_NAME: ${{ github.event_name }}
            #   REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            #   REPO: ${{ env.ECR_REPOSITORY }}
        run: |
              TAG="${{ matrix.service.name }}:latest"
              # if [ "$EVENT_NAME" = "pull_request" ]; then
              #   TAG="test-build:latest"
              # else
              #   TAG="$REGISTRY/$REPO:latest"
              # fi
              echo "Building image tagged as $TAG..."
              docker build -t "$TAG" ${{ matrix.service.context }}
              echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.build-image.outputs.image_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
